# Swarm Sentinel control plane — proxy sidecar (shared by docker compose and the Helm chart).
# Containerized form of server/deploy/nginx-api.conf; the numbers match that vhost exactly so
# the two deployments cannot drift:
#   * the Bun plane binds 127.0.0.1:8787 (code-enforced loopback) — unreachable except here;
#   * this proxy is the only ingress, on :8080 (non-root port);
#   * TLS terminates at the host nginx vhost (systemd deployment) or the cluster ingress (Helm),
#     never at this layer.
#
# The per-IP request-rate zone below is the *outer* layer against floods; the authoritative
# per-tenant limit lives in the app (RateLimiter), keyed by token, not IP.

limit_req_zone $binary_remote_addr zone=sentinel_api:10m rate=30r/s;

server {
    listen 8080;
    server_name _;

    # Transport cap: reject abusive payloads before they reach Bun (413).
    client_max_body_size 64k;

    # Small bodies only; don't buffer request bodies to disk.
    client_body_buffer_size 64k;
    proxy_request_buffering on;

    location / {
        limit_req zone=sentinel_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live JEV adjudication can take up to the upstream timeout; stay above it.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }
}
