# JEVULON VII (JVII) Private Enterprise Docker VPC
name: jevulon-vii

services:
  control-plane:
    image: cxdegxd/jevulon-vii-control-plane:latest
    env_file:
      - path: .env
        required: false
    environment:
      CONTROL_PLANE_ENC_KEY: ${CONTROL_PLANE_ENC_KEY:-5b8f6c4d7e2a1b9c3f0e8a7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b}
      SENTINEL_TOKENS: ${SENTINEL_TOKENS:-jvii_ent_demo_license_token}
      SENTINEL_DATA_DIR: /var/lib/swarm-sentinel/triggers
      SENTINEL_CORPUS_DIR: /var/lib/swarm-sentinel/corpus
      SENTINEL_NO_CONTRIBUTION: ${SENTINEL_NO_CONTRIBUTION:-1}
      PORT: "8787"
      JEV_ENDPOINT: ${JEV_ENDPOINT:-https://drex.nace.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-drex-latest}
      JEV_API_KEY: ${JEV_API_KEY:-}
    volumes:
      - corpus:/var/lib/swarm-sentinel/corpus
      - triggers:/var/lib/swarm-sentinel/triggers
    tmpfs:
      - /tmp:mode=1777
    ports:
      - "127.0.0.1:8787:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 512m
    restart: unless-stopped

  proxy:
    image: cxdegxd/jevulon-vii-proxy:latest
    network_mode: "service:control-plane"
    depends_on:
      - control-plane
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  corpus:
  triggers:
